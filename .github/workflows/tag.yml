name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test-and-build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test and release requirements
        run: python -m pip install -r requirements_test.txt -r requirements_release.txt

      - name: Run tests
        run: |
          python -m pytest \
            -vv \
            -qq \
            --timeout=9 \
            --durations=10 \
            --cov podpointclient \
            --cov-report term \
            --cov-report html \
            -o console_output_style=count \
            -p no:sugar \
            tests

      - name: Store code coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: htmlcov/
          if-no-files-found: error

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Store release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/podpointclient-niknakk/
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/

      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@release/v1
